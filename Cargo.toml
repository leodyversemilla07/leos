[workspace]
resolver = "3"
members = [
    "crates/leos-core",
    "crates/leos-client",
    "crates/leos-ffi",
    "crates/leos-cli",
    "crates/leos-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
leos-core = { path = "crates/leos-core" }
leos-client = { path = "crates/leos-client" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
