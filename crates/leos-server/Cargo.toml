[package]
name = "leos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Leos wallet API: authoritative balances, a double-entry ledger, and the payment rails behind the mobile app."

[lib]
name = "leos_server"
path = "src/lib.rs"

[[bin]]
name = "leos-server"
path = "src/main.rs"

[dependencies]
leos-core.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
