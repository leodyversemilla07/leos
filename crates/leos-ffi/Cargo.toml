[package]
name = "leos-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The foreign function interface between the Leos Rust core and the native mobile user interfaces."

[lib]
name = "leos_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
leos-client = { path = "../leos-client" }
jni = "0.21"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
